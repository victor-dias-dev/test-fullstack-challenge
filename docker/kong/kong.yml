_format_version: "3.0"

plugins:
  - name: cors
    config:
      origins:
        - "http://localhost:3000"
        - "http://localhost:3001"
        - "http://localhost:5173"
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - Authorization
        - Content-Type
        - Accept
      credentials: true
      max_age: 3600

services:
  - name: games-service
    url: http://games:4001
    plugins:
      - name: rate-limiting
        config:
          minute: 600
          policy: local
          limit_by: ip
          fault_tolerant: true
    routes:
      - name: games-routes
        paths:
          - /games
        strip_path: true

  - name: wallets-service
    url: http://wallets:4002
    plugins:
      - name: rate-limiting
        config:
          minute: 300
          policy: local
          limit_by: ip
          fault_tolerant: true
    routes:
      - name: wallets-routes
        paths:
          - /wallets
        strip_path: true
